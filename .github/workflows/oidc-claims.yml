# Diagnostic, run by hand: prints the claims of this repository's GitHub OIDC
# token for the AWS audience, i.e. what the deploy role's trust policy must
# match (infra/: DeployRole). Only the decoded payload's claims are printed,
# never the token. No AWS access.
name: OIDC claims

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print the token's claims
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$token"
          payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          base64 -d <<<"$payload" | jq '{iss, aud, sub, ref, repository, repository_id, repository_owner, repository_owner_id, environment, event_name, job_workflow_ref}'
