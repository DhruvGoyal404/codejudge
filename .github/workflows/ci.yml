# CI: Go unit tests, API tests (real Postgres + Valkey), web unit tests, and
# the sandbox integration suite on Linux under runc AND gVisor (runsc).
# Actions are pinned by commit SHA; versions follow the two-week rule.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly: the full matrix again (all four languages, both runtimes) against
  # whatever the private problems repo holds now.
  schedule:
    - cron: "17 21 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# bash -eo pipefail: without pipefail, "go test | tee" reports tee's status and
# a failing suite looks green (it did, in the first run).
defaults:
  run:
    shell: bash

jobs:
  go-unit:
    name: Go unit tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      - run: go version
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./... && go vet -tags integration ./...
      - run: go test -count=1 ./...
      - name: systemd units are valid
        working-directory: .
        run: |
          sudo install -D /bin/true /opt/codejudge/current/bin/judge-worker
          sudo install -D /bin/true /opt/codejudge/current/app/deploy/backup/pg-backup.sh
          systemd-analyze verify deploy/systemd/judge-worker.service deploy/systemd/pg-backup.service deploy/systemd/pg-backup.timer
      - name: shellcheck
        working-directory: .
        run: shellcheck --severity=warning deploy/backup/*.sh deploy/host/*.sh scripts/*.sh

  # Hidden tests live in the private codejudge-problems repo, read through a
  # read-only deploy key (secret PROBLEMS_DEPLOY_KEY). Fork PRs get no secrets,
  # so jobs that need it run only for this repo's own pushes and PRs.
  problems:
    name: Problems (public samples match the hidden copies)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CODEJUDGE_PROBLEMS_TESTS_DIR: ${{ github.workspace }}/problems-private
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DhruvGoyal404/codejudge-problems
          ssh-key: ${{ secrets.PROBLEMS_DEPLOY_KEY }}
          path: problems-private
          persist-credentials: false
          fetch-depth: 0 # full history: the packed size below
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      - name: No hidden data in the public repo
        run: |
          if git ls-files 'problems/*/tests/*' 'problems/*/gen/*' 'problems/*/solutions/*' | grep .; then
            echo "hidden problem data is tracked in the public repo"; exit 1
          fi
      # Hidden tests are stored, not regenerated (decided at 244 MiB packed,
      # ~25 s clones). Revisit if the private repo grows past 500 MiB.
      - name: Private repo size
        run: |
          git -C problems-private gc -q
          kib=$(git -C problems-private count-objects -v | awk '/^size-pack:/ {print $2}')
          echo "codejudge-problems packed: $((kib / 1024)) MiB"
          if [ "$kib" -gt $((500 * 1024)) ]; then
            echo "::warning title=Private problems repo is large::packed size $((kib / 1024)) MiB > 500 MiB: consider regenerating tests at CI/deploy time instead of storing them"
          fi
      - name: Samples byte-match the hidden copies
        run: python3 scripts/sync-samples.py --check
      - name: Every package loads (bounds, tests, samples) with stable hashes
        working-directory: runner
        run: go run ./cmd/judge-admin check ../problems

  api:
    name: API tests (Postgres + Valkey)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: codejudge
          POSTGRES_DB: codejudge
          POSTGRES_PASSWORD: ci-only-password
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U codejudge -d codejudge" --health-interval 2s --health-timeout 3s --health-retries 30
      valkey:
        image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        ports: ["56379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CODEJUDGE_DATABASE_URL: postgres://codejudge:ci-only-password@127.0.0.1:55432/codejudge?sslmode=disable
      CODEJUDGE_VALKEY_URL: redis://127.0.0.1:56379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DhruvGoyal404/codejudge-problems
          ssh-key: ${{ secrets.PROBLEMS_DEPLOY_KEY }}
          path: problems-private
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Migrate
        run: >-
          docker run --rm --network host -v "$PWD/db:/db:ro"
          -e DATABASE_URL="$CODEJUDGE_DATABASE_URL" -e DBMATE_MIGRATIONS_DIR=/db/migrations -e DBMATE_NO_DUMP_SCHEMA=true
          ghcr.io/amacneil/dbmate:2.36.0@sha256:520c740c6e0ad73fde2cd1ea7e2b779aaf789d22aca8858f87a478e7094535fb up
      - name: Seed problems (hidden tests from the private repo)
        env:
          CODEJUDGE_PROBLEMS_TESTS_DIR: ${{ github.workspace }}/problems-private
        working-directory: runner
        run: go run ./cmd/judge-admin import ../problems
      - name: Install
        working-directory: api
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: api
        run: npx tsc --noEmit
      - name: Test
        working-directory: api
        run: npm test

  web:
    name: Web unit tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Bundle budget (main chunk <= +20%, Monaco lazy)
        run: node scripts/check-bundle.mjs

  # Full stack: real API, Vite, Postgres, Valkey, sandbox images and a real
  # judge-worker. On failure, the worker/API logs and the affected submission
  # and run records (kept instead of cleaned up) are uploaded as an artifact.
  e2e:
    name: End-to-end (browser + API, real worker)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: codejudge
          POSTGRES_DB: codejudge
          POSTGRES_PASSWORD: ci-only-password
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U codejudge -d codejudge" --health-interval 2s --health-timeout 3s --health-retries 30
      valkey:
        image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        ports: ["56379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CODEJUDGE_DATABASE_URL: postgres://codejudge:ci-only-password@127.0.0.1:55432/codejudge?sslmode=disable
      CODEJUDGE_VALKEY_URL: redis://127.0.0.1:56379
      CODEJUDGE_PROBLEMS_TESTS_DIR: ${{ github.workspace }}/problems-private
      E2E_EVIDENCE_DIR: ${{ github.workspace }}/e2e-evidence
      # Dummy OAuth app: the login test only checks the redirect to GitHub (never followed).
      GITHUB_CLIENT_ID: ci-dummy-client-id
      GITHUB_CLIENT_SECRET: ci-dummy-client-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DhruvGoyal404/codejudge-problems
          ssh-key: ${{ secrets.PROBLEMS_DEPLOY_KEY }}
          path: problems-private
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: Build sandbox images
        run: pwsh -NoProfile -File scripts/build-images.ps1
      - name: Migrate
        run: >-
          docker run --rm --network host -v "$PWD/db:/db:ro"
          -e DATABASE_URL="$CODEJUDGE_DATABASE_URL" -e DBMATE_MIGRATIONS_DIR=/db/migrations -e DBMATE_NO_DUMP_SCHEMA=true
          ghcr.io/amacneil/dbmate:2.36.0@sha256:520c740c6e0ad73fde2cd1ea7e2b779aaf789d22aca8858f87a478e7094535fb up
      - name: Install
        run: |
          (cd api && npm ci --no-audit --no-fund)
          (cd web && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
      - name: Browser e2e (Playwright)
        working-directory: web
        run: npx playwright test
      - name: API e2e (verdicts, custom input)
        if: success() || failure()
        working-directory: api
        run: npx vitest run --config vitest.e2e.config.ts -t "verdicts through the API|custom input"
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidence
          path: |
            e2e-evidence/
            web/test-results/
          retention-days: 14
          if-no-files-found: warn

  sandbox:
    name: Sandbox integration (${{ matrix.runtime }})
    runs-on: ubuntu-24.04 # the production host's release
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        runtime: [runc, runsc]
    defaults:
      run:
        working-directory: runner
    env:
      CODEJUDGE_PROBLEMS_TESTS_DIR: ${{ github.workspace }}/problems-private
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          repository: DhruvGoyal404/codejudge-problems
          ssh-key: ${{ secrets.PROBLEMS_DEPLOY_KEY }}
          path: problems-private
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      # The production host bootstrap (minus the AWS CLI) installs the pinned
      # Docker and gVisor and registers runsc WITH --oci-seccomp; a second run
      # must change nothing. TestSeccompActive proves the flag takes effect.
      - name: Bootstrap the host (deploy/host/bootstrap.sh, twice)
        if: matrix.runtime == 'runsc'
        working-directory: .
        run: scripts/ci-bootstrap-check.sh
      - name: Docker / kernel
        run: |
          docker version --format 'engine {{.Server.Version}} api {{.Server.APIVersion}}'
          docker info --format 'cgroup v{{.CgroupVersion}} driver {{.CgroupDriver}} runtimes {{json .Runtimes}}'
          uname -a
      - name: Build sandbox images
        working-directory: .
        run: pwsh -NoProfile -File scripts/build-images.ps1
      - name: Sandbox integration suite
        env:
          JUDGE_TEST_RUNTIME: ${{ matrix.runtime == 'runsc' && 'runsc' || '' }}
        run: |
          set -o pipefail
          go test -p 1 -tags integration -count=1 -timeout 40m -v ./internal/sandbox/ 2>&1 | tee "$RUNNER_TEMP/sandbox-${{ matrix.runtime }}.log"
      # Tests are regenerated from the seeded generators, every input passes
      # its validator, and ref.cpp / ref.py produce byte-identical outputs
      # equal to the committed ones (scripts/make-tests.py --check).
      - name: Problem tests reproduce (validators, C++/Python cross-check)
        if: matrix.runtime == 'runc' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        working-directory: .
        run: python3 scripts/make-tests.py --check
      # Every problem judged with its solutions: ref.* AC (non-C++ within 50%
      # of the multiplied limit), wrong* WA, slow* TLE. C++ on every push; all
      # four languages nightly. The max_cpu lines are the calibration data.
      - name: Problems judged (C++ on push, all languages nightly)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          JUDGE_TEST_RUNTIME: ${{ matrix.runtime == 'runsc' && 'runsc' || '' }}
          JUDGE_PROBLEM_LANGS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'cpp,python,java,javascript' || 'cpp' }}
        run: |
          set -o pipefail
          go test -p 1 -tags integration -count=1 -timeout 30m -v -run 'TestProblems' ./internal/judge/ 2>&1 | tee "$RUNNER_TEMP/seed-${{ matrix.runtime }}.log"
      - name: Summary
        if: always()
        run: |
          log="$RUNNER_TEMP/sandbox-${{ matrix.runtime }}.log"
          [ -f "$log" ] || exit 0
          {
            echo "### Sandbox integration under ${{ matrix.runtime }}"
            echo '```'
            grep -E '^(--- (PASS|FAIL|SKIP)|ok|FAIL|PASS)' "$log" | sed 's/ (.*//' | sort | uniq -c | sort -rn | head -5
            grep -E '^--- FAIL' "$log" || true
            echo '```'
            seed="$RUNNER_TEMP/seed-${{ matrix.runtime }}.log"
            if [ -f "$seed" ]; then
              echo "### Seed problems: reference max CPU (ms / effective limit)"
              echo '```'
              grep -oE '[a-z-]+/(ref|wrong|slow)\.[a-z]+ \[[a-z-]+\] -> [A-Z]+|max_cpu=[0-9]+ms/[0-9]+ms' "$seed" | paste - - || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # deploy/host/deploy.sh end to end on a bootstrapped Ubuntu 24.04 host, the
  # AWS parts replaced by a local registry, a parameters file and a local
  # checkout of the hidden tests: a good release, a broken one (automatic
  # rollback), another good one, then a manual rollback.
  host-deploy:
    name: Host deploy end to end (bootstrap, deploy, rollback)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DhruvGoyal404/codejudge-problems
          ssh-key: ${{ secrets.PROBLEMS_DEPLOY_KEY }}
          path: problems-private
          persist-credentials: false
      - name: Bootstrap the host (twice)
        run: scripts/ci-bootstrap-check.sh
      - name: Build sandbox images
        run: pwsh -NoProfile -File scripts/build-images.ps1
      - name: Deploy, roll back, roll back by hand
        run: scripts/ci-deploy-e2e.sh problems-private
      - name: Host logs
        if: failure()
        run: |
          sudo journalctl -u judge-worker --no-pager -n 200 || true
          sudo docker compose -p codejudge-prod logs --no-color --tail 200 || true
