# /etc/tmpfiles.d/codejudge.conf — Unix-socket directories shared by the
# compose services (Postgres, Valkey) and the host worker. The outer directory
# is the access boundary: only root and the codejudge group can traverse it,
# whatever modes the containers set on the inner directories.
# Type Path                          Mode User Group     Age
d      /run/codejudge                0750 root codejudge -
d      /run/codejudge/postgresql     2775 70   70        -
d      /run/codejudge/valkey         0755 999  1000      -
